<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhivyakti Workshop</title>
    <meta name="theme-color" content="#75cbb3">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/appicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/appicon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-screen">
        <header class="topbar">
            <h1>Abhivyakti Workshop</h1>
            <button class="nav-button" aria-label="Next page">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </header>

        <div class="user-tab">
            <span>Ritik Chourasiya</span>
        </div>

        <main class="details-panel">
            <div class="details-column">
                <div class="detail-row">
                    <span class="label">Name :</span>
                    <span class="value">Ritik Chourasiya</span>
                </div>

                <div class="detail-row">
                    <span class="value">Male | 22 yrs</span>
                </div>

                <div class="detail-row">
                    <span class="label">Batch Time :</span>
                    <span class="value">04:15 - 05:15 PM</span>
                </div>

                <div class="detail-row venue-row">
                    <span class="label">Venue :</span>
                    <span class="value">Manas Bhawan (Polytechnic)<br>Polytechnic Chouraha, Bhopal</span>
                </div>
            </div>

            <div class="photo-box">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80"
                    alt="Workshop participant portrait">
                <button class="photo-upload-btn" id="photoUploadButton" type="button" aria-label="Upload profile photo"
                    title="Upload profile photo">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h3l1.5-2h7L17 7h3v12H4z" />
                        <circle cx="12" cy="13" r="3.5" />
                    </svg>
                </button>
                <input id="photoUploadInput" type="file" accept="image/*" hidden>
            </div>
        </main>

        <div class="action-grid">
            <button class="action-btn">Photo ID</button>
            <button class="action-btn">Receipt</button>
            <button class="action-btn">ID Card</button>
            <button class="action-btn">Invoice</button>
        </div>

        <button class="scan-btn" aria-label="Scan document">
            <svg viewBox="0 0 64 64" aria-hidden="true">
                <path
                    d="M8 18V10a2 2 0 0 1 2-2h8v6h-8v8H8zm0 28v8a2 2 0 0 0 2 2h8v-6h-8v-4h-2zm48-30V8a2 2 0 0 0-2-2h-8v6h8v8h6zm0 28v4h-6v6h8a2 2 0 0 0 2-2v-8h-4zm-12-18h-8v6h8v-6zm-8 10h-8v6h8v-6zm20-4h-8v6h8v-6zm-20-8h-8v6h8v-6zm8-10h8v6h-8v-6zm-8 12h8v6h-8v-6zm16 4h8v6h-8v-6zm-16 10h8v6h-8v-6z"
                    fill="currentColor" />
                <rect x="18" y="18" width="28" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="3" />
            </svg>
            <span>SCAN</span>
        </button>
    </div>

    <div class="scanner-modal hidden" id="scannerModal" aria-modal="true" role="dialog" aria-label="QR scanner">
        <video id="qrVideo" autoplay playsinline muted></video>
        <canvas id="qrCanvas" hidden></canvas>
        <div class="scanner-shade" aria-hidden="true"></div>

        <div class="scanner-content">
            <header class="scanner-toolbar">
                <button class="scanner-icon-button" id="closeScanner" aria-label="Close scanner">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>
            </header>

            <div class="scanner-guide" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
            </div>

            <p class="scanner-status" id="scannerStatus" aria-live="polite"></p>

            <div class="scanner-read-label" aria-hidden="true">Read QR</div>
            <div class="scanner-home-indicator" aria-hidden="true"></div>
        </div>

    </div>

    <div class="scan-success hidden" id="scanSuccess" role="dialog" aria-label="Ticket used successfully">
        <img src="pass.jpeg" alt="Ticket Used Successfully">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
